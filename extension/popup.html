<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
      margin: 0;
      color: #1a1a1a;
    }
    h3 { margin-top: 0; font-size: 16px; display: flex; align-items: center; gap: 6px; }
    p { font-size: 12px; color: #666; line-height: 1.4; }
    button {
      width: 100%;
      background: #2563eb;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
    }
    button:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <h3>✈️ ApplyPilot</h3>
  <p>Highlight any text on LinkedIn or job sites, right-click, and choose <strong>"Send selected post to ApplyPilot"</strong>.</p>
  <button id="openApp">Open ApplyPilot Dashboard</button>
  <script src="popup.js"></script>
</body>
</html>
